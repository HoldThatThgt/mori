# Mori 的 Windows 打包配置：NSIS 安装包（可选安装目录）与免安装目录版；不签名、不发布、不自动更新。
appId: com.holdthatthgt.mori
productName: Mori
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
# 托盘图标（src/main/tray.ts）：Windows 用系统接口按路径读 .ico，放进 app.asar.unpacked，让它读的是磁盘上的文件。
asarUnpack:
  - out/main/chunks/*.ico
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # 安装与卸载界面只用英文：不写时打包全部 26 种语言，NSIS 按系统语言选择，中文 Windows 上会显示中文。
  # 只列 en_US 时 app-builder-lib（nsisLang.js 的 LangConfigurator）只插入 English 一种语言，与系统语言无关。
  installerLanguages: [en_US]
publish: null
